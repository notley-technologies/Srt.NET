# Dependabot cannot see the libsrt and OpenSSL pins in native/versions.json. Every day this workflow compares them with
# upstream releases and, for each component with a newer release, runs its update script (native/cmake/Update*.cmake)
# and opens a pull request with the workflow's GITHUB_TOKEN, so a maintainer approves its CI runs. If the check or an
# update fails, an issue reports it. See MAINTAINING.md#native-dependency-updates.
name: Native dependency updates

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}

env:
  RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      updates: ${{ steps.compare.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned native versions with upstream releases
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Succeeds when the first version is newer than the second.
          is_newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

          openssl_pinned=$(jq -r .openssl.version native/versions.json)
          srt_pinned=$(jq -r .srt.version native/versions.json)
          srt_line="${srt_pinned%.*}"

          # OpenSSL: only openssl-X.Y.Z release tags on the pinned long-term support line; alpha and beta tags are ignored.
          openssl_latest=$(git ls-remote --tags --refs https://github.com/openssl/openssl.git "refs/tags/openssl-${openssl_pinned%.*}.*" \
            | sed -n "s|.*refs/tags/openssl-\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p" | sort -V | tail -n 1)

          # libsrt: published releases tagged vX.Y.Z. Release candidates are prereleases or bare -rc tags, and
          # releases/latest can point at a backport, so compare versions instead. The newest release on the pinned
          # minor line comes first, so a pending minor upgrade never holds back a patch release.
          srt_releases=$(gh api --paginate repos/Haivision/srt/releases \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V)
          srt_latest=$(printf '%s\n' "$srt_releases" | tail -n 1)
          srt_patch=$(printf '%s\n' "$srt_releases" | awk -F. -v line="$srt_line" '$1 "." $2 == line' | tail -n 1)

          if [ -z "$openssl_latest" ] || [ -z "$srt_latest" ]; then
            echo "::error::Could not determine the latest upstream releases."
            exit 1
          fi

          srt_target="$srt_latest"
          if [ -n "$srt_patch" ] && is_newer "$srt_patch" "$srt_pinned"; then
            srt_target="$srt_patch"
          fi

          # One branch per component, and one per libsrt minor line for upgrades that need a closer look, so a patch
          # release never takes over a pull request that is under review.
          updates='[]'
          if is_newer "$openssl_latest" "$openssl_pinned"; then
            updates=$(jq -c --arg from "$openssl_pinned" --arg to "$openssl_latest" \
              '. + [{component: "openssl", name: "OpenSSL", from: $from, to: $to, patch: true, branch: "native-updates/openssl"}]' <<< "$updates")
          fi

          if is_newer "$srt_target" "$srt_pinned"; then
            patch=true branch=native-updates/libsrt
            if [ "${srt_target%.*}" != "$srt_line" ]; then
              patch=false branch="native-updates/libsrt-${srt_target%.*}"
            fi
            updates=$(jq -c --arg from "$srt_pinned" --arg to "$srt_target" --argjson patch "$patch" --arg branch "$branch" \
              '. + [{component: "libsrt", name: "libsrt", from: $from, to: $to, patch: $patch, branch: $branch}]' <<< "$updates")
          fi

          echo "OpenSSL $openssl_pinned (latest $openssl_latest), libsrt $srt_pinned (latest $srt_latest); updates: $updates"
          echo "updates=$updates" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    # Pull requests are opened only from main; elsewhere the check above is a dry run.
    if: needs.check.outputs.updates != '[]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Push the update branch.
      pull-requests: write # Create the label and open the pull request.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.updates) }}
    env:
      TITLE: Update the bundled ${{ matrix.name }} to ${{ matrix.to }}
      UPSTREAM: ${{ matrix.component == 'libsrt' && 'https://github.com/Haivision/srt' || 'https://github.com/openssl/openssl' }}
      TAG: ${{ matrix.component == 'libsrt' && 'v' || 'openssl-' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the pin
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail

          # Only this repository's own update branch counts, so a fork's pull request with the same branch name and title
          # cannot hold an update back. An open pull request for this release is left as it is unless it conflicts with
          # main, and a closed, unmerged one means a maintainer declined the release. A pull request for an older release
          # is replaced.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state all --limit 100 \
            --json number,title,state,isCrossRepository,mergeable \
            --jq 'map(select(.title == env.TITLE and .state != "MERGED" and (.isCrossRepository | not)
              and (.state != "OPEN" or .mergeable != "CONFLICTING")))[0] // empty | "#\(.number) is \(.state | ascii_downcase)"')

          if [ -n "$existing" ]; then
            echo "$TITLE: $existing, so the workflow leaves it alone." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare="$UPSTREAM/compare/$TAG$FROM...$TAG$TO"
          case "$COMPONENT" in
            libsrt)
              # libsrt is pinned by commit because a tag can move, so the review link compares the pinned commits.
              from_commit=$(jq -r .srt.commit native/versions.json)
              cmake -DSRT_VERSION="$TO" -P native/cmake/UpdateLibsrt.cmake
              compare="$UPSTREAM/compare/$from_commit...$(jq -r .srt.commit native/versions.json)"
              ;;
            openssl) cmake -DOPENSSL_VERSION="$TO" -P native/cmake/UpdateOpenSSL.cmake ;;
            *) echo "::error::Unknown component $COMPONENT."; exit 1 ;;
          esac
          echo "compare=$compare" >> "$GITHUB_OUTPUT"

          # The OpenSSL verification downloads into artifacts/, which git ignores; keep the tree to the pin changes.
          rm -rf artifacts
          gh label create native-dependencies --repo "$GITHUB_REPOSITORY" --force --color 1d76db --description "Bundled libsrt or OpenSSL update"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.update.outputs.skip != 'true'
        with:
          branch: ${{ matrix.branch }}
          base: main
          sign-commits: true
          delete-branch: true
          commit-message: ${{ env.TITLE }}
          title: ${{ env.TITLE }}
          labels: native-dependencies
          body: |
            Updates the bundled ${{ matrix.name }} from ${{ matrix.from }} to ${{ matrix.to }}: [release notes](${{ env.UPSTREAM }}/releases/tag/${{ env.TAG }}${{ matrix.to }}), [upstream changes](${{ steps.update.outputs.compare }}).

            **To start CI**, select **Approve workflows to run** on this pull request. GitHub holds the CI runs of a pull request that a workflow's `GITHUB_TOKEN` opens or updates until someone with write access approves them, so approve again after each update.

            - [ ] Read the release notes.
            - [ ] libsrt only: check `srt.h` for new functions and `SRTO_*` options.
            - [ ] Before the next release, a maintainer updates `CHANGELOG.md` as [MAINTAINING.md](${{ github.server_url }}/${{ github.repository }}/blob/main/MAINTAINING.md#changelog-entries) describes.
            - [ ] A new minor or major release (not a patch) needs a closer look: the API, the ABI or behavior may change.

            Closing this pull request declines ${{ matrix.name }} ${{ matrix.to }}; the workflow does not propose it again. A newer release replaces this branch, title and description, discarding commits pushed here. Opened by `.github/workflows/native-updates.yml` ([run](${{ env.RUN }})).

  report:
    needs: [check, update]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # Open or comment on the failure issue.
    steps:
      - name: Report the failure in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Native dependency update failed
          DOCS: ${{ github.server_url }}/${{ github.repository }}/blob/main/MAINTAINING.md#native-dependency-updates
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')

          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The native dependency update failed: $RUN. If creating the pull request failed with \"GitHub Actions is not permitted to create or approve pull requests\", turn on **Allow GitHub Actions to create and approve pull requests** in Settings > Actions > General > Workflow permissions (an organization owner may need to allow it first). To update by hand, see $DOCS. Close this issue once the update works again."
          fi
