# Dependabot cannot see the libsrt and OpenSSL pins in native/versions.json. This weekly check compares them with
# upstream releases and keeps one tracking issue open while an update is available.
name: Native dependency check

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # Open, update, or close the tracking issue.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned native versions with upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: native-dependencies
          TITLE: Native dependency update available
        run: |
          set -euo pipefail

          # Succeeds when the first version is newer than the second.
          is_newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

          openssl_pinned=$(jq -r .openssl.version native/versions.json)
          srt_pinned=$(jq -r .srt.version native/versions.json)
          openssl_line="${openssl_pinned%.*}"

          # Follow only the pinned OpenSSL release line (3.5 is a long-term support line). Release tags are
          # openssl-X.Y.Z; alpha, beta, and other tags are ignored.
          openssl_latest=$(git ls-remote --tags --refs https://github.com/openssl/openssl.git "refs/tags/openssl-$openssl_line.*" \
            | sed -n "s|.*refs/tags/openssl-\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p" | sort -V | tail -n 1)
          srt_latest=$(gh api repos/Haivision/srt/releases/latest --jq '.tag_name | ltrimstr("v")')

          if [ -z "$openssl_latest" ] || [ -z "$srt_latest" ]; then
            echo "::error::Could not determine the latest upstream releases."
            exit 1
          fi

          {
            echo "| Component | Pinned | Latest |"
            echo "| --- | --- | --- |"
            echo "| OpenSSL $openssl_line | $openssl_pinned | $openssl_latest |"
            echo "| libsrt | $srt_pinned | $srt_latest |"
          } > versions.md
          cat versions.md >> "$GITHUB_STEP_SUMMARY"

          # Only the issue this workflow opened: the label alone could match issues that people filed or relabeled.
          # gh reports issues opened with the workflow token as authored by app/github-actions.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" --json number,author \
            --jq 'map(select(.author.login == "app/github-actions")) | .[0].number // empty')

          if ! is_newer "$openssl_latest" "$openssl_pinned" && ! is_newer "$srt_latest" "$srt_pinned"; then
            echo "Pinned native versions are current."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
                --comment "native/versions.json now pins OpenSSL $openssl_pinned and libsrt $srt_pinned, the latest upstream releases."
            fi

            exit 0
          fi

          body=$(
            echo "A newer upstream release of a bundled native dependency is available."
            echo
            cat versions.md
            echo
            echo "Update procedure (see CONTRIBUTING.md, \"Updating native dependencies\"):"
            echo
            echo "- OpenSSL: \`cmake -DOPENSSL_VERSION=<version> -P native/UpdateOpenSSL.cmake\` (needs GnuPG)."
            echo "- libsrt: update the version and immutable commit in \`native/versions.json\`, the notices, and the native version test."
            echo "- Add a CHANGELOG entry (under Security when the update fixes vulnerabilities), run the full CI matrix, and release."
            echo
            echo "Review the [OpenSSL vulnerability list](https://openssl-library.org/news/vulnerabilities/) and the [libsrt releases](https://github.com/Haivision/srt/releases) to judge urgency."
            echo
            echo "This issue is maintained by \`.github/workflows/native-updates.yml\` and closes automatically once \`native/versions.json\` is current."
          )

          if [ -z "$existing" ]; then
            gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force --color 1d76db --description "Bundled libsrt or OpenSSL update (managed by native-updates.yml)"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body "$body"
          elif [ "$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" != "$body" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Upstream releases changed: OpenSSL $openssl_latest, libsrt $srt_latest."
          fi
