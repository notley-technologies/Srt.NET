name: Feature request
description: Propose a new capability, API, or supported platform.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [native API coverage audit](https://github.com/notley-technologies/Srt.NET/blob/main/docs/api-coverage.md) first;
        some libsrt features are deliberately deferred and the audit explains why.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what prevents you from doing it today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like. A short usage example helps.
      render: csharp
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Socket API (sync or async)
        - Stream adapter
        - Options, statistics, or logging
        - Native build or supported platforms
        - Packaging or tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: native-api
    attributes:
      label: libsrt API involved
      description: The libsrt functions, options, or socket flags this needs, if known.
      placeholder: srt_bind_acquire, SRTO_GROUPCONNECT

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other designs you considered.
